services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
      - mqtt
    environment:
      - DATABASE_URL=postgresql://babyuser:supersecret@db/babytracker
      - MQTT_BROKER=mqtt
      - ENABLE_MQTT=1
    restart: always

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: babyuser
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: babytracker
    volumes:
      - pgdata:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
