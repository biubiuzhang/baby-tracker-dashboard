<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Baby Activity Tracker</title>
</head>
<body>
  <h2>📅 Log for {{ today }}</h2>
  <ul>
    {% for activity, count in counts.items() %}
      <li>{{ activity }}: {{ count }}</li>
    {% endfor %}
  </ul>

  <h3>➕ Add New Entry</h3>
  <form method="POST" action="{{ url_for('main.add_entry') }}">
    <button name="color" value="Blue">Feed (Blue)</button>
    <button name="color" value="Red">Diaper (Red)</button>
    <button name="color" value="Green">Pee (Green)</button>
    <button name="color" value="Yellow">Poo (Yellow)</button>
    <button name="color" value="Black">Bath (Black)</button>
  </form>
</body>
</html>
